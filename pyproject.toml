[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "study-planner"
version = "0.1.0"
description = "An explainable, graph-backed study planner"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "itsdangerous>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "falkordb>=1.0,<2",
  "firebase-admin>=6.5,<8",
  "pyyaml>=6,<7",
  "pydantic>=2,<3",
  "mcp>=2,<3",
]

[project.optional-dependencies]
llm = ["litellm>=1.50,<2"]
dev = ["pytest>=8"]
embedded = ["falkordblite; python_version >= '3.12'"]

[tool.setuptools.packages.find]
include = ["app*"]
