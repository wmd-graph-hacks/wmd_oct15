<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Studyspace · Studyspace</title>
<style>
:root{--bg:#f6f3ed;--ink:#2b2a27;--mute:#6f6a5f;--card:#fffdf8;--line:#e3dccd;--accent:#b4532a;--sage:#5c7f5b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;padding:24px}
.panel{width:min(100%,560px);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,5vw,40px);box-shadow:0 12px 38px #2b2a2710}
.brand{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:.04em}.eyebrow{color:var(--mute);font-size:13px;margin:30px 0 6px}h1{font-size:clamp(28px,6vw,38px);line-height:1.1;margin:0 0 10px;letter-spacing:-.04em}p{color:var(--mute);margin:0 0 24px}
label{display:block;font-weight:600;margin:18px 0 7px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit}input:focus,select:focus{outline:2px solid #b4532a55;border-color:var(--accent)}.hint{font-size:13px;color:var(--mute);margin-top:6px}
button{margin-top:24px;width:100%;border:0;border-radius:9px;padding:12px 16px;background:var(--accent);color:white;font:600 16px system-ui;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#status{min-height:24px;margin-top:12px;color:var(--mute);font-size:14px}#status.error{color:#a02e20}a{color:var(--mute);font-size:13px}
</style>
</head>
<body><main class="panel">
<div class="brand">✦ STUDYSPACE</div>
<div class="eyebrow">YOUR PERSONAL LEARNING SPACE</div>
<h1>{{ "Your profile." if profile.complete else "Let’s make this yours." }}</h1>
<p>A few details for your learning space. You only need to do this once. Your phone number is optional.</p>
<form id="setup">
  <label for="full-name">Your name</label>
  <input id="full-name" name="full_name" maxlength="100" required autocomplete="name" value="{{ profile.full_name or (user.name[:100] if user.name else '') }}" placeholder="Your name">
  <label for="name">What should we call you?</label>
  <input id="name" name="name" maxlength="50" required autocomplete="nickname" value="{{ profile.preferred_name or (user.name.split(' ')[0][:50] if user.name else '') }}" placeholder="Preferred name">
  <div class="hint">You can change this any time.</div>
  <label for="phone">Phone number <span class="hint">(optional)</span></label>
  <input id="phone" name="phone" type="tel" maxlength="30" autocomplete="tel" value="{{ profile.phone_number or '' }}" placeholder="Your phone number">
  <label for="role">Which best describes you?</label>
  <select id="role" name="role" required>
    <option value="">Choose your role</option>
    <option value="student" {% if profile.role == 'student' %}selected{% endif %}>Student</option>
    <option value="educator" {% if profile.role == 'educator' %}selected{% endif %}>Educator</option>
    <option value="professional" {% if profile.role == 'professional' %}selected{% endif %}>Working professional</option>
    <option value="other" {% if profile.role == 'other' %}selected{% endif %}>Other</option>
  </select>
  <label for="industry">Industry or field</label>
  <select id="industry" name="industry" required>
    <option value="">Choose an industry</option>
    {% for item in ['Education', 'Technology', 'Healthcare', 'Finance', 'Science & research', 'Business & consulting', 'Design & media', 'Other'] %}
    <option value="{{ item }}" {% if profile.industry == item %}selected{% endif %}>{{ item }}</option>
    {% endfor %}
  </select>
  <label for="interest">What are you interested in learning?</label>
  <input id="interest" name="interest" maxlength="100" required value="{{ profile.interest_area or '' }}" placeholder="e.g. AI, biology, design, mathematics">
  <button id="save" type="submit">{{ "Save changes" if profile.complete else "Build my study space" }}</button>
  <div id="status" role="status" aria-live="polite"></div>
</form>
<form method="post" action="/auth/logout"><button type="submit" style="background:transparent;color:var(--mute);margin:0;padding:0;text-align:left;font-size:13px">Sign out</button></form>
</main>
<script>
const $=s=>document.querySelector(s);
async function api(path,opt={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},signal:AbortSignal.timeout(15000),...opt});const body=await r.json().catch(()=>({}));if(r.status===401){location.assign('/login');throw new Error('Please sign in again.')}if(!r.ok)throw new Error(Array.isArray(body.detail)?body.detail.map(x=>x.msg).join('. '):body.detail||'Something went wrong. Please try again.');return body}
$('#setup').addEventListener('submit',async e=>{e.preventDefault();const button=$('#save'),status=$('#status'),name=$('#name').value.trim();if(!name){$('#name').focus();return}button.disabled=true;status.className='';status.textContent='Setting up your study space…';
try{await api('/api/account-profile',{method:'POST',body:JSON.stringify({full_name:$('#full-name').value.trim(),preferred_name:name,phone_number:$('#phone').value.trim()||null,role:$('#role').value,industry:$('#industry').value,interest_area:$('#interest').value.trim()})});location.assign('/agent')}catch(err){status.textContent=err.message;status.className='error';button.disabled=false}});
</script></body></html>
