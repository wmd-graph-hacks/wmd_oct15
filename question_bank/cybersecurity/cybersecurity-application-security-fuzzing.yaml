subtopic_id: cybersecurity-application-security-fuzzing
questions:
- id: fuzzing-integration-and-limits-1
  level: 1
  stem: Which item is explicitly included in the scope of Application Security and
    this lesson?
  options:
  - fuzzing
  - calorimetry
  - PCR amplification
  - Jordan normal form
  answer: 0
  hints:
  - Use the lesson scope list.
  - Look for the concept fuzzing in the unit.
  explanation: fuzzing is one of the named concepts in this unit. Use its definition
    and relationships in context, rather than treating the name alone as understanding.
- id: fuzzing-integration-and-limits-application
  level: 2
  stem: Before drawing a conclusion about fuzzing, what should you do?
  options:
  - Define how the concept is used in this problem and check the relevant assumptions
    or evidence.
  - Assume the term has the same meaning in every context.
  - Ignore conditions that could limit the model.
  - Accept the first plausible result without checking it.
  answer: 0
  hints:
  - A familiar label does not establish that a model applies.
  - Check the concept in its specific context.
  explanation: fuzzing should be interpreted in context. Start from an explicit asset,
    threat, and trust boundary. Analyze the least-privilege defensive control and
    its evidence. Practical exercises must remain in an isolated environment with
    explicit authorization and scope.
- id: fuzzing-integration-and-limits-reasoning
  level: 3
  stem: Which evidence best supports a security control claim?
  options:
  - Use an approved bounded test and preserve evidence tied to the stated threat and
    asset.
  - Apply a familiar rule without checking whether its assumptions fit.
  - Report an outcome without retaining the evidence or inputs needed to reproduce
    it.
  - Change several relevant conditions at once, making the cause of the outcome unclear.
  answer: 0
  hints:
  - Choose evidence that tests the claim made in the question.
  - Keep assumptions and the relevant comparison visible.
  explanation: Use an approved bounded test and preserve evidence tied to the stated
    threat and asset. Start from an explicit asset, threat, and trust boundary. Analyze
    the least-privilege defensive control and its evidence. Practical exercises must
    remain in an isolated environment with explicit authorization and scope.
