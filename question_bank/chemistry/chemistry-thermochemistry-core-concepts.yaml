- id: enthalpy-foundations-reasoning
  level: 3
  stem: Which check best supports a chemical calculation?
  options:
  - Check atom and charge balance, units, conditions, and agreement with the chemical
    model.
  - Apply a familiar rule without checking whether its assumptions fit.
  - Report an outcome without retaining the evidence or inputs needed to reproduce
    it.
  - Change several relevant conditions at once, making the cause of the outcome unclear.
  answer: 0
  hints:
  - Choose evidence that tests the claim made in the question.
  - Keep assumptions and the relevant comparison visible.
  explanation: Check atom and charge balance, units, conditions, and agreement with
    the chemical model. Write a balanced equation or particle-level model first. Track
    atoms, charge, units, and conditions; show the calculation; then check whether
    the magnitude and direction agree with the chemical model.
