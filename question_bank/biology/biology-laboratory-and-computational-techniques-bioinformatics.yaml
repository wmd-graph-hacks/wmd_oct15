- id: bioinformatics-applications-and-analysis-reasoning
  level: 3
  stem: Which evidence best supports a causal biological explanation?
  options:
  - Use a controlled comparison that tests a prediction while measuring the relevant
    outcome.
  - Apply a familiar rule without checking whether its assumptions fit.
  - Report an outcome without retaining the evidence or inputs needed to reproduce
    it.
  - Change several relevant conditions at once, making the cause of the outcome unclear.
  answer: 0
  hints:
  - Choose evidence that tests the claim made in the question.
  - Keep assumptions and the relevant comparison visible.
  explanation: Use a controlled comparison that tests a prediction while measuring
    the relevant outcome. State the biological scale and hypothesis, identify the
    control and measured outcome, trace the proposed mechanism, and distinguish correlation
    from causal evidence. Consider biological variability and ethical limits.
