- id: python-or-go-for-automation-foundations-reasoning
  level: 3
  stem: Which evidence best supports a safe infrastructure change?
  options:
  - Review the plan, stage the change, monitor health, and verify rollback or recovery.
  - Apply a familiar rule without checking whether its assumptions fit.
  - Report an outcome without retaining the evidence or inputs needed to reproduce
    it.
  - Change several relevant conditions at once, making the cause of the outcome unclear.
  answer: 0
  hints:
  - Choose evidence that tests the claim made in the question.
  - Keep assumptions and the relevant comparison visible.
  explanation: Review the plan, stage the change, monitor health, and verify rollback
    or recovery. Trace a change from source through deployment to runtime signals.
    Make the desired state, access boundaries, failure signal, rollback path, and
    recovery objective explicit before changing a system.
