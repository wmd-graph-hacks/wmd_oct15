- id: cost-observability-applications-and-analysis-application
  level: 2
  stem: Before drawing a conclusion about cost observability, what should you do?
  options:
  - Define how the concept is used in this problem and check the relevant assumptions
    or evidence.
  - Assume the term has the same meaning in every context.
  - Ignore conditions that could limit the model.
  - Accept the first plausible result without checking it.
  answer: 0
  hints:
  - A familiar label does not establish that a model applies.
  - Check the concept in its specific context.
  explanation: cost observability should be interpreted in context. Trace a change
    from source through deployment to runtime signals. Make the desired state, access
    boundaries, failure signal, rollback path, and recovery objective explicit before
    changing a system.
- id: cost-observability-applications-and-analysis-reasoning
  level: 3
  stem: Which evidence best supports a safe infrastructure change?
  options:
  - Review the plan, stage the change, monitor health, and verify rollback or recovery.
  - Apply a familiar rule without checking whether its assumptions fit.
  - Report an outcome without retaining the evidence or inputs needed to reproduce
    it.
  - Change several relevant conditions at once, making the cause of the outcome unclear.
  answer: 0
  hints:
  - Choose evidence that tests the claim made in the question.
  - Keep assumptions and the relevant comparison visible.
  explanation: Review the plan, stage the change, monitor health, and verify rollback
    or recovery. Trace a change from source through deployment to runtime signals.
    Make the desired state, access boundaries, failure signal, rollback path, and
    recovery objective explicit before changing a system.
