- id: functional-programming-concepts-mechanisms-and-methods-reasoning
  level: 3
  stem: Which check best supports an algorithm's correctness?
  options:
  - Trace edge cases and verify invariants as well as time and space behavior.
  - Apply a familiar rule without checking whether its assumptions fit.
  - Report an outcome without retaining the evidence or inputs needed to reproduce
    it.
  - Change several relevant conditions at once, making the cause of the outcome unclear.
  answer: 0
  hints:
  - Choose evidence that tests the claim made in the question.
  - Keep assumptions and the relevant comparison visible.
  explanation: Trace edge cases and verify invariants as well as time and space behavior.
    Trace a small input by hand, state the invariant that should remain true, and
    account for time, space, and edge cases. Use a test case that distinguishes the
    intended behavior from a plausible bug.
