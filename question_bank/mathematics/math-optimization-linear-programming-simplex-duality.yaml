  stem: "Weak duality states that for a max primal and min dual, any feasible primal value is:"
  options: ["≥ any feasible dual value", "≤ any feasible dual value", "= the dual value", "unrelated"]
  answer: 1
  hints: ["The dual provides upper bounds on a maximization."]
  explanation: "Primal objective ≤ dual objective for feasible pairs."
