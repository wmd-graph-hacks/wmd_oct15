subtopic_id: physics-classical-mechanics-core-concepts
questions:
- id: cm-1
  level: 1
  stem: Newton's second law relates net force to which quantity?
  options:
  - Mass times acceleration
  - Mass times velocity
  - Work divided by time
  - Momentum divided by distance
  answer: 0
  hints:
  - It describes the rate of change of momentum.
  - For constant mass, the relation is F_net = ma.
  explanation: For constant mass, the net force is the mass multiplied by acceleration.
- id: cm-2
  level: 2
  stem: What does the work-energy theorem state?
  options:
  - Net work equals the change in kinetic energy
  - Net work equals the change in momentum
  - Power equals the change in position
  - Force equals the change in potential energy
  answer: 0
  hints:
  - Work is energy transferred by a force over displacement.
  - The theorem relates work to a scalar measure of motion.
  explanation: The net work done on an object equals its change in kinetic energy.
- id: cm-3
  level: 3
  stem: When is the total momentum of a system conserved?
  options:
  - When the net external impulse on the system is zero
  - Whenever the objects move at constant speed
  - Only when all collisions are elastic
  - Whenever internal forces are absent
  answer: 0
  hints:
  - Consider the system boundary and external forces.
  - Momentum changes according to net external impulse.
  explanation: Total momentum is conserved when the net external impulse on the system
    is zero; internal forces cancel in the system total.
