- id: newton-s-laws-foundations-reasoning
  level: 3
  stem: Which check best supports a physical model's prediction?
  options:
  - Check dimensions and limiting cases, then compare with measurement and uncertainty.
  - Apply a familiar rule without checking whether its assumptions fit.
  - Report an outcome without retaining the evidence or inputs needed to reproduce
    it.
  - Change several relevant conditions at once, making the cause of the outcome unclear.
  answer: 0
  hints:
  - Choose evidence that tests the claim made in the question.
  - Keep assumptions and the relevant comparison visible.
  explanation: Check dimensions and limiting cases, then compare with measurement
    and uncertainty. Draw the system and choose coordinates and sign conventions.
    State approximations, derive the relation before inserting values, preserve units,
    and check limiting cases or conservation laws.
