subtopic_id: physics-thermodynamics-core-concepts
questions:
- id: thermo-1
  level: 1
  stem: What does the first law of thermodynamics express?
  options:
  - Conservation of energy for a thermodynamic system
  - That heat always flows into a system
  - That every process is reversible
  - That temperature is conserved
  answer: 0
  hints:
  - It is an energy balance.
  - Heat and work transfer energy across the system boundary.
  explanation: The first law accounts for changes in internal energy through heat
    and work, with signs set by convention.
- id: thermo-2
  level: 2
  stem: For an isolated system, what does the second law say about entropy?
  options:
  - It does not decrease for a spontaneous process
  - It must remain zero
  - It always decreases
  - It equals the system's internal energy
  answer: 0
  hints:
  - An isolated system exchanges neither matter nor energy.
  - The law gives a direction to spontaneous change.
  explanation: The entropy of an isolated system stays constant for an ideal reversible
    process and increases for an irreversible spontaneous process.
- id: thermo-3
  level: 3
  stem: For an ideal gas undergoing an isothermal change, which statement is correct?
  options:
  - Its internal energy change is zero because internal energy depends only on temperature
  - Its internal energy must increase because volume changes
  - Its entropy change is always zero
  - No heat can enter or leave the gas
  answer: 0
  hints:
  - For an ideal gas, internal energy is a function of temperature.
  - Isothermal means the temperature is constant.
  explanation: At constant temperature an ideal gas has no change in internal energy,
    though heat and work may be exchanged.
