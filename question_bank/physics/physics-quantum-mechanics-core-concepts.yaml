subtopic_id: physics-quantum-mechanics-core-concepts
questions:
- id: qm-1
  level: 1
  stem: In the Born interpretation, what does |ψ(x)|² represent?
  options:
  - The particle's energy at x
  - The probability density of finding the particle near x
  - The particle's momentum at x
  - The force on the particle at x
  answer: 1
  hints:
  - It is always non-negative.
  - Integrated over all space it equals 1.
  explanation: '|ψ|² is the probability density; its integral over all space is 1
    for a normalized state.'
- id: qm-2
  level: 2
  stem: What does the Heisenberg uncertainty principle say about position and momentum?
  options:
  - Both can be known exactly at once
  - The product of their uncertainties has a lower bound of ħ/2
  - Momentum is always zero when position is known
  - Uncertainty only comes from poor instruments
  answer: 1
  hints:
  - It is a property of the state, not of the equipment.
  - Δx Δp ≥ ħ/2.
  explanation: Δx·Δp ≥ ħ/2 is a fundamental limit of quantum states.
- id: qm-3
  level: 3
  stem: Two electrons cannot occupy the same quantum state. Which principle is this?
  options:
  - Pauli exclusion principle
  - Correspondence principle
  - Superposition principle
  - Equivalence principle
  answer: 0
  hints:
  - It applies to identical fermions.
  - It helps explain the structure of the periodic table.
  explanation: The Pauli exclusion principle forbids identical fermions from sharing
    a quantum state.
