subtopic_id: backend-engineering-software-architecture-design-patterns
questions:
- id: design-patterns-applications-and-analysis-1
  level: 1
  stem: Which item is explicitly included in the scope of Software Architecture and
    this lesson?
  options:
  - design patterns (factory, strategy, observer, adapter, decorator)
  - Hardy-Weinberg equilibrium
  - orbital angular momentum
  - electrochemical potential
  answer: 0
  hints:
  - Use the lesson scope list.
  - Look for the concept design patterns (factory, strategy, observer, adapter, decorator)
    in the unit.
  explanation: design patterns (factory, strategy, observer, adapter, decorator) is
    one of the named concepts in this unit. Use its definition and relationships in
    context, rather than treating the name alone as understanding.
- id: design-patterns-applications-and-analysis-application
  level: 2
  stem: Before drawing a conclusion about design patterns (factory, strategy, observer,
    adapter, decorator), what should you do?
  options:
  - Define how the concept is used in this problem and check the relevant assumptions
    or evidence.
  - Assume the term has the same meaning in every context.
  - Ignore conditions that could limit the model.
  - Accept the first plausible result without checking it.
  answer: 0
  hints:
  - A familiar label does not establish that a model applies.
  - Check the concept in its specific context.
  explanation: design patterns (factory, strategy, observer, adapter, decorator) should
    be interpreted in context. Trace one request from caller to storage and back.
    Mark trust boundaries, state changes, failure points, and retry behavior; then
    test the contract at both normal and partial-failure cases.
- id: design-patterns-applications-and-analysis-reasoning
  level: 3
  stem: Which check best supports a claim that a service change is safe?
  options:
  - Test contracts on success and failure paths, including retries and state changes.
  - Apply a familiar rule without checking whether its assumptions fit.
  - Report an outcome without retaining the evidence or inputs needed to reproduce
    it.
  - Change several relevant conditions at once, making the cause of the outcome unclear.
  answer: 0
  hints:
  - Choose evidence that tests the claim made in the question.
  - Keep assumptions and the relevant comparison visible.
  explanation: Test contracts on success and failure paths, including retries and
    state changes. Trace one request from caller to storage and back. Mark trust boundaries,
    state changes, failure points, and retry behavior; then test the contract at both
    normal and partial-failure cases.
